<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Screen Design Configuration</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #f4f6f9, #e9ecef);
        }

        .page-wrapper {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .form-card {
            width: 100%;
            max-width: 80%;
            border-radius: 10px;
        }

        .form-header {
            border-bottom: 1px solid #dee2e6;
            margin-bottom: 20px;
            padding-bottom: 10px;
        }

        textarea {
            min-height: 150px;
            height: 300px;
            resize: vertical;
            font-family: monospace;
        }
    </style>
</head>
<body>

<div class="page-wrapper">
    <div class="card shadow form-card">
        <div class="card-body">

            <!-- Header -->
            <div class="form-header">
                <h4 class="mb-1">Screen Design Configuration</h4>
                <small class="text-muted">
                    Define screen details and HTML design template
                </small>
            </div>

            <!-- Form -->
            <form method="post">
                {% csrf_token %}

                <div class="row">
                    <div class="col-md-6">
                        <!-- Screen Name -->
                        <div class="mb-3">
                        <label class="form-label fw-semibold">Screen Name</label>
                        <input
                            type="text"
                            name="screen_name"
                            class="form-control"
                            placeholder="e.g. Dashboard Screen"
                            required
                        >
                        </div>
                    </div>
                    <div class="col-md-6">
                        <!-- Control ID -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Control ID</label>
                            <input
                                type="text"
                                name="control_id"
                                class="form-control"
                                placeholder="e.g. dashboard_topbar"
                                required
                            >
                        </div>
                    </div>
                </div>

                

                

                <!-- Design Template -->
                <div class="mb-4">
                    <label class="form-label fw-semibold">Design Template (HTML)</label>
                    <textarea
                        name="design_template"
                        class="form-control"
                        placeholder="Paste your HTML design here"
                        required
                    ></textarea>
                </div>

                <!-- Buttons -->
                <div class="d-flex justify-content-end gap-2">
                    <button type="reset" class="btn btn-outline-secondary">
                        Clear
                    </button>
                    <button type="submit" class="btn btn-primary px-4">
                        Save Screen
                    </button>
                </div>

            </form>

        </div>
    </div>
</div>

</body>
</html>
